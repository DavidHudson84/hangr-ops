<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hangr Ops</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316202E'/%3E%3Cpath d='M13.6 8.2a2.4 2.4 0 1 1 2.4 2.4v1.6L6.4 20.6a1.3 1.3 0 0 0 .9 2.3h17.4a1.3 1.3 0 0 0 .9-2.3L16 12.2' fill='none' stroke='%23C9A46A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202E;--navy:#16202E;--blue:#2E6FBF;--accent:#9A733B;--accent2:#C9A46A;--accent-soft:#F4EDE1;--bg:#F6F4EF;--card:#fff;--mute:#5E6B7C;--line:#E4DFD4;--line2:#EFEBE3;--good:#2F7A4C;--bad:#B4402E;--warn:#A86A12;--chip:#F1EEE7;
  --serif:"Fraunces",Georgia,serif;--sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--side:236px;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:14px/1.5 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
/* sidebar */
#hdr{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:#C9CFD8;display:flex;flex-direction:column;z-index:20}
#hdr[hidden]{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;text-decoration:none;color:#fff}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand b span{color:var(--accent2);font-weight:500}
.orgname{padding:0 18px 14px;font-size:12px;color:#8E99A8;border-bottom:1px solid rgba(255,255,255,.08)}
.orgname select{width:100%;margin-top:4px;background:#1F2B3C;color:#fff;border:1px solid #33435A;padding:5px 8px;font-size:12px}
#nav{flex:1;overflow-y:auto;padding:10px 10px 16px;scrollbar-width:thin;scrollbar-color:#33435A transparent}
#nav a{display:flex;align-items:center;gap:10px;color:#C9CFD8;text-decoration:none;padding:7px 10px;border-radius:8px;font-weight:500}
#nav a svg{width:17px;height:17px;flex:none;opacity:.75}
#nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#nav .sec.open > a{color:#fff}
#nav .sec.on > a{background:rgba(255,255,255,.09);color:#fff}
#nav .sec.on > a svg{opacity:1;color:var(--accent2)}
#nav .kids{display:none;margin:2px 0 8px 19px;padding-left:10px;border-left:1px solid rgba(255,255,255,.1)}
#nav .sec.open .kids{display:block}
#nav .kids a{padding:5px 10px;font-weight:400;font-size:13px;color:#A9B3C1}
#nav .kids a.on{color:#fff;background:rgba(201,164,106,.16);box-shadow:inset 2px 0 0 var(--accent2)}
#nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6F7B8C;padding:9px 10px 3px}
.me{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8E99A8;display:flex;flex-direction:column;gap:8px}
.me #who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{align-self:flex-start;background:none;border:1px solid #33435A;color:#C9CFD8;border-radius:7px;padding:4px 10px;font:inherit;cursor:pointer}
.me button:hover{color:#fff;border-color:#55657C}
#mtop{display:none}
#scrim{display:none}
/* page */
main{margin-left:var(--side);padding:26px 32px 40px;max-width:calc(1280px + var(--side))}
#hdr[hidden] ~ main{margin-left:0;max-width:none}
#lbrand{display:none}
#hdr[hidden] ~ #lbrand{display:flex;justify-content:center;padding:56px 0 0}
#lbrand .brand{color:var(--ink);padding:0}
#lbrand .brand b span{color:var(--accent)}
h1.pt{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.015em;margin:0;line-height:1.15}
h1.pt small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ph{margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(22,32,46,.04)}
.card h2{margin:0 0 12px;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.005em}
.card h2 small{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--mute);margin-left:6px;letter-spacing:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(22,32,46,.04)}
.tile .l{color:var(--mute);font-size:12px}
.tile .v{font-family:var(--serif);font-size:25px;font-weight:600;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;margin-top:2px}
.up{color:var(--good)}.dn{color:var(--bad)}.mu{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--mute);font-weight:600;background:#FAF8F4;position:sticky;top:0;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer}tr.click:hover td{background:#FBF7EF}
tr.tot td{font-weight:650;background:#FAF8F4}
.scroll{overflow-x:auto}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--chip);font-size:12px;color:var(--ink)}
a.btn{text-decoration:none;display:inline-block}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{background:#26344A}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(154,115,59,.35);outline-offset:0;border-color:var(--accent)}
textarea{width:100%;min-height:90px}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
details summary{cursor:pointer}
.login{max-width:400px;margin:22px auto 60px;padding:22px 24px}
.login h2{font-size:20px}
.login input{width:100%}
.drop{border:2px dashed #D3C8B4;border-radius:12px;padding:30px;text-align:center;color:var(--mute);background:#FCFAF6}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.log div{padding:6px 0;border-bottom:1px solid var(--line2)}
.err{color:var(--bad)}
.note{color:var(--mute);font-size:12px}
svg text{font-size:11px;fill:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
@media print{#hdr,#mtop,#scrim,.noprint,#lb ~ *,.row.noprint,.ph{display:none!important}body,html{background:#fff}main{padding:0;margin:0}main > .row{display:none}.card{border:0;box-shadow:none}a{color:inherit;text-decoration:none}}
@media (max-width:900px){
  #hdr{transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.navopen #hdr{transform:none}
  body.navopen #scrim{display:block;position:fixed;inset:0;background:rgba(22,32,46,.45);z-index:15}
  #hdr:not([hidden]) ~ #mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:9px 14px}
  #mtop button{background:none;border:0;color:#fff;padding:4px;cursor:pointer;display:flex}
  #mtop svg{width:22px;height:22px}
  #mtop b{font-family:var(--serif);font-size:17px;font-weight:600}
  #mtop b span{color:var(--accent2);font-weight:500}
  #mtop .cur{margin-left:auto;font-size:13px;color:#C9CFD8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  main{margin-left:0;padding:16px 14px 30px}
  h1.pt{font-size:22px}
}
@media (max-width:600px){.tile .v{font-size:20px}th,td{padding:5px 6px}.card{padding:13px 13px}}
</style>
</head>
<body>
<aside id="hdr" hidden>
  <a class="brand" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#9A733B" opacity=".18"/><path d="M13.6 8.2a2.4 2.4 0 1 1 2.4 2.4v1.6L6.4 20.6a1.3 1.3 0 0 0 .9 2.3h17.4a1.3 1.3 0 0 0 .9-2.3L16 12.2" fill="none" stroke="#C9A46A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Hangr <span>Ops</span></b></a>
  <div class="orgname"><span id="orgName"></span><select id="orgSel" hidden></select></div>
